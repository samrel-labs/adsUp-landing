<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>۴۰۴ — صفحه پیدا نشد | Adwerto</title>
<meta name="description" content="صفحه‌ای که به دنبال آن هستید پیدا نشد." />
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#07070d" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&family=Inter:wght@100..900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>
  .err {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .err__glow {
    position: absolute;
    inset: -30%;
    background:
      radial-gradient(circle at 30% 30%, var(--glow-1), transparent 50%),
      radial-gradient(circle at 70% 70%, var(--glow-3), transparent 50%);
    filter: blur(60px);
    pointer-events: none;
  }
  .err__inner { position: relative; z-index: 1; max-width: 620px; }
  .err__code {
    font-size: clamp(6rem, 18vw, 11rem);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -.05em;
    background: linear-gradient(120deg, var(--brand-1), var(--brand-2) 50%, var(--brand-3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 12px;
  }
  .err__title { font-size: clamp(1.3rem, 3vw, 1.9rem); font-weight: 800; margin-bottom: 14px; }
  .err__text { color: var(--text-muted); margin-bottom: 32px; font-size: 1rem; }
  .err__actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 40px; }
  .err__links { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
  .err__links a {
    font-size: .88rem;
    color: var(--text-muted);
    border-bottom: 1px dashed var(--border-strong);
    padding-bottom: 2px;
    transition: color var(--transition);
  }
  .err__links a:hover { color: var(--brand-2); }
</style>
</head>
<body>

<header class="header">
  <div class="container header__inner">
    <a href="/" class="logo" aria-label="Adwerto">
      <span class="logo__mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <path d="M6 22 L16 6 L26 22" stroke="url(#lg404)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="16" cy="22" r="3" fill="url(#lg404)"/>
          <defs><linearGradient id="lg404" x1="0" y1="0" x2="32" y2="32">
            <stop stop-color="#6366f1"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/>
          </linearGradient></defs>
        </svg>
      </span>
      <span class="logo__text">Adwerto<span class="logo__dot">.</span></span>
    </a>
    <div class="header__actions">
      <button class="icon-btn" id="langToggle404" aria-label="Change language">
        <span class="icon-btn__label" id="langLabel404">EN</span>
      </button>
      <button class="icon-btn" id="themeToggle404" aria-label="Toggle theme">
        <svg class="ico ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M19.1 4.9l-1.6 1.6M6.5 17.5l-1.6 1.6"/>
        </svg>
        <svg class="ico ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main class="err">
  <div class="err__glow" aria-hidden="true"></div>
  <div class="err__inner">
    <div class="err__code">404</div>
    <h1 class="err__title" data-i18n="err.title">صفحه‌ای که دنبالش هستید پیدا نشد</h1>
    <p class="err__text" data-i18n="err.text">
      احتمالاً آدرس اشتباه تایپ شده یا این صفحه منتقل شده است.
    </p>
    <div class="err__actions">
      <a href="/" class="btn btn--primary btn--lg" data-i18n="err.home">بازگشت به خانه</a>
      <a href="/#contact" class="btn btn--ghost btn--lg" data-i18n="err.contact">تماس با ما</a>
    </div>
    <div class="err__links">
      <a href="/#services" data-i18n="nav.services">خدمات</a>
      <a href="/#pricing" data-i18n="nav.pricing">تعرفه‌ها</a>
      <a href="/#faq" data-i18n="nav.faq">سوالات متداول</a>
    </div>
  </div>
</main>

<script>
(() => {
  const html = document.documentElement;
  const I18N = {
    fa: {
      'err.title': 'صفحه‌ای که دنبالش هستید پیدا نشد',
      'err.text': 'احتمالاً آدرس اشتباه تایپ شده یا این صفحه منتقل شده است.',
      'err.home': 'بازگشت به خانه',
      'err.contact': 'تماس با ما',
      'nav.services': 'خدمات',
      'nav.pricing': 'تعرفه‌ها',
      'nav.faq': 'سوالات متداول'
    },
    en: {
      'err.title': 'The page you are looking for was not found',
      'err.text': 'The URL might be mistyped or the page has moved.',
      'err.home': 'Back to home',
      'err.contact': 'Contact us',
      'nav.services': 'Services',
      'nav.pricing': 'Pricing',
      'nav.faq': 'FAQ'
    }
  };

  const applyTheme = (t) => {
    html.setAttribute('data-theme', t);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'dark' ? '#07070d' : '#fbfbfe');
  };
  const applyLang = (l) => {
    const d = I18N[l];
    html.setAttribute('lang', l);
    html.setAttribute('dir', l === 'fa' ? 'rtl' : 'ltr');
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const k = el.getAttribute('data-i18n');
      if (d[k]) el.textContent = d[k];
    });
    const ll = document.getElementById('langLabel404');
    if (ll) ll.textContent = l === 'fa' ? 'EN' : 'فا';
    document.title = l === 'fa' ? '۴۰۴ — صفحه پیدا نشد | Adwerto' : '404 — Page not found | Adwerto';
  };

  applyTheme(localStorage.getItem('adwerto_theme') || 'dark');
  applyLang(localStorage.getItem('adwerto_lang') || 'fa');

  document.getElementById('themeToggle404')?.addEventListener('click', () => {
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    localStorage.setItem('adwerto_theme', next);
  });
  document.getElementById('langToggle404')?.addEventListener('click', () => {
    const next = html.getAttribute('lang') === 'fa' ? 'en' : 'fa';
    applyLang(next);
    localStorage.setItem('adwerto_lang', next);
  });
})();
</script>
</body>
</html>
